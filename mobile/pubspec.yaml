name: trekindia
description: Production-grade offline-first Himalayan tactical field instrument & P2P expedition mesh.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Map & Geospatial
  maplibre_gl: 0.28.0

  # Offline Local Database
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0

  # Wearable BLE GATT & Mesh Advertisements
  flutter_blue_plus: ^1.34.5
  health: ^13.3.2
  geolocator: ^12.0.0

  # Ad-Hoc Camp Sync Offline Wi-Fi Server
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  shelf_web_socket: ^2.0.0
  web_socket_channel: ^3.0.1

  # Network & Resumable Media
  tus_client_dart: ^2.0.1
  http: ^1.2.1
  crypto: ^3.0.3

  # Audio & Sensors
  sensors_plus: ^5.0.1
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/topo/
